<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Download File Info</title>
<style>
  /* IDM's Download File Info window, as the approved mockup (brand/confirm-mockup.html); the page is the whole window */
  :root {
    --window: #ECECEF; --toolbar: #F6F6F8; --panel: #FFFFFF; --line: #D9D9DE; --text: #1D1D1F; --muted: #6E6E73;
    --hover: rgba(0,0,0,.06); --accent: #0F766E; --on-accent: #FFFFFF; --fill: #0F766E; --soft: #D6EEEA; --field: #FFFFFF;
    --err: #D70015; --warn: #B45309;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --window: #1E1E20; --toolbar: #2A2A2D; --panel: #232326; --line: #3A3A3E; --text: #F5F5F7; --muted: #A1A1A6;
      --hover: rgba(255,255,255,.07); --fill: #14B8A6; --soft: #12403C; --field: #1B1B1D; --err: #FF453A; --warn: #FFB340;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--panel); color: var(--text);
    font: 13px/1.4 "SF Pro Text", "SF Pro", -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
  .win { min-height: 100%; display: flex; flex-direction: column; background: var(--panel); }
  .head { display: flex; align-items: center; gap: 12px; padding: 16px 20px 14px; border-bottom: 1px solid var(--line); background: var(--toolbar); }
  .head img { width: 36px; height: 36px; }
  .head > div { min-width: 0; }
  .head h1 { margin: 0; font: 600 16px "SF Pro Display", "SF Pro", -apple-system, system-ui, sans-serif; }
  .head p { margin: 1px 0 0; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  form { flex: 1; align-content: start; padding: 16px 20px 6px; display: grid; grid-template-columns: 86px 1fr; gap: 12px 12px; align-items: center; }
  label, .lbl { color: var(--muted); font-size: 12.5px; }
  .url { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); user-select: all; }
  select, input[type=text] { font: inherit; color: var(--text); background: var(--field); border: 1px solid var(--line); border-radius: 7px; height: 30px; padding: 0 9px; width: 100%; }
  select { width: auto; min-width: 170px; }
  .row { display: flex; gap: 8px; align-items: center; min-width: 0; }
  .row input { flex: 1; min-width: 0; }
  .hint { grid-column: 2; margin-top: -6px; font-size: 11.5px; color: var(--muted); }
  .hint.warn { color: var(--warn); }
  .hint.err { color: var(--err); }
  .btn { font: inherit; height: 30px; padding: 0 14px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel); color: var(--text); cursor: pointer; white-space: nowrap; }
  .btn:hover { background: var(--hover); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  :focus-visible { outline: 2px solid var(--fill); outline-offset: 2px; }
  #format { min-width: 250px; }
  .size { font-weight: 600; }
  .foot { display: flex; align-items: center; gap: 8px; padding: 14px 20px 16px; margin-top: 10px; border-top: 1px solid var(--line); background: var(--toolbar); }
  .foot .spacer { flex: 1; }
</style>
</head>
<body>
<div class="win">
  <div class="head"><img src="/favicon.ico" alt=""><div><h1>Download File Info</h1><p id="sub"></p></div></div>
  <form id="f" novalidate>
    <span class="lbl">URL</span><span class="url" id="url"></span>
    <span class="hint warn" id="note" hidden></span>
    <label for="format" data-yt hidden>Format</label>
    <div data-yt hidden><select id="format"></select></div>
    <label for="cat">Category</label>
    <div><select id="cat"><option>Compressed</option><option>Documents</option><option>Music</option><option>Programs</option><option>Video</option><option>Other</option></select></div>
    <label for="file">Save As</label>
    <div class="row"><input type="text" id="file" spellcheck="false" autocomplete="off" aria-describedby="hint err"><button type="button" class="btn" id="browse">Browse…</button></div>
    <span class="hint" id="hint">Missing folders are created.</span>
    <span class="hint err" id="err" role="alert" hidden></span>
    <span class="lbl">Size</span><span id="size"></span>
  </form>
  <div class="foot">
    <button type="button" class="btn" id="later">Download Later</button><span class="spacer"></span>
    <button type="button" class="btn" id="cancel">Cancel</button><button type="submit" form="f" class="btn primary" id="start">Start Download</button>
  </div>
</div>

<script id="helpers">
// No DOM in this block: ui.test.js runs it in Node. Paths are Windows paths.
// Category folder, as engine.js assignName(): <dir>\<Category>, Other and categories off go straight into <dir>
function folderFor(settings, category) {
  const dir = String(settings.dir).replace(/[\\/]+$/, '');
  return settings.categories && category !== 'Other' ? dir + '\\' + category : dir;
}
const splitPath = p => { const i = Math.max(p.lastIndexOf('\\'), p.lastIndexOf('/')); return [p.slice(0, Math.max(i, 0)), p.slice(i + 1)]; };
const joinPath = (folder, name) => folder.replace(/[\\/]+$/, '') + '\\' + name;
const withExt = (name, ext) => name.replace(/\.[^.\\/]*$/, '') + ext;
const size = n => n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(1) + ' KB' : n < 1073741824 ? (n / 1048576).toFixed(1) + ' MB' : (n / 1073741824).toFixed(2) + ' GB';
// YouTube formats (the probe's options from /api/formats): option text, extension and category of a key.
// 'best' and 'mp3' are the legacy choices offered when the list could not be read.
const formatText = o => [o.group === 'Audio' ? o.label : o.group, o.group === 'Audio' ? 'audio' : o.label, size(o.size)].join(' · ');
const formatExt = key => key === 'best' ? '.mp4' : '.' + key.split(':')[0];
const formatCategory = key => /^(m4a|mp3)/.test(key) ? 'Music' : 'Video';
// Header line: the name (a YouTube title without its extension) · the host without www.
function subtitle(d, name) {
  let host = '';
  try { host = new URL(d.url).hostname.replace(/^www\./, ''); } catch {}
  return [d.kind === 'video' ? withExt(name, '') : name, host].filter(Boolean).join(' · ');
}
</script>
<script>
const $ = s => document.querySelector(s);
const id = new URLSearchParams(location.search).get('id');
let d, settings, busy = false, listing = false;

async function api(path, body) {
  let r;
  try { r = await fetch(path, body ? { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) } : undefined); }
  catch { throw new Error('FastDL is not running. Start it from the Start menu.'); }
  const j = await r.json();
  if (!r.ok) throw new Error(j.error);
  return j;
}
function error(text) {
  $('#err').textContent = text ?? '';
  $('#err').hidden = !text;
}

const option = () => d.probe.options?.find(o => o.key === $('#format').value);

// The Format list: optgroups MP4 / WEBM / Audio with real sizes; "Getting formats…" while the probe lists them.
function fillFormats(p) {
  const sel = $('#format');
  const opt = (text, value) => { const o = document.createElement('option'); o.textContent = text; o.value = value; return o; };
  sel.replaceChildren();
  if (p.listing) sel.append(opt('Getting formats…', ''));
  else if (!p.options.length) sel.append(opt('MP4 · best quality', 'best'), opt('MP3 · audio', 'mp3')); // the list failed: yt-dlp picks
  else for (const g of ['MP4', 'WEBM', 'Audio']) {
    const items = p.options.filter(o => o.group === g);
    if (!items.length) continue;
    const og = document.createElement('optgroup');
    og.label = g;
    og.append(...items.map(o => opt(formatText(o), o.key)));
    sel.append(og);
  }
  sel.value = p.format ?? sel.options[0].value;
}

function showSize(p) {
  const o = d.kind === 'video' ? option() : null, n = d.kind === 'video' ? o?.size : p.size;
  $('#size').textContent = n != null ? size(n) : d.kind === 'video' ? 'Known once the download starts' : 'Unknown';
  $('#size').className = n != null ? 'size' : '';
}

// Format swaps the extension, the category (Video ↔ Music) and the size.
function setFormat() {
  const key = $('#format').value, [, name] = splitPath($('#file').value);
  $('#cat').value = formatCategory(key);
  $('#file').value = joinPath(folderFor(settings, $('#cat').value), withExt(name, formatExt(key)));
  showSize(d.probe);
}

function fill(p) {
  const yt = d.kind === 'video';
  listing = !!p.listing;
  for (const e of document.querySelectorAll('[data-yt]')) e.hidden = !yt;
  if (yt) fillFormats(p);
  $('#cat').value = p.category;
  $('#file').value = joinPath(folderFor(settings, p.category), p.name);
  $('#sub').textContent = subtitle(d, p.name);
  showSize(p);
  $('#note').textContent = p.error ? `Couldn't read the file details (${p.error}). You can still try to start it.` : '';
  $('#note').hidden = !p.error;
  lock(false);
  // while yt-dlp lists the formats only Cancel works; the rest fills in when the list is there
  for (const s of ['#format', '#cat', '#file', '#browse', '#later', '#start']) $(s).disabled = listing;
  $(listing ? '#cancel' : '#start').focus();
}

function lock(on, action) {
  busy = on;
  for (const b of document.querySelectorAll('button')) b.disabled = on;
  $('#start').textContent = on && action === 'start' ? 'Starting…' : 'Start Download';
}

async function load() {
  lock(true);
  for (let t = 0; ; t++) {
    try {
      const st = await api('/api/state');
      settings = st.settings;
      d = st.downloads.find(x => x.id === id);
    } catch (e) { return error(e.message); }
    if (!d || d.status !== 'pending') {
      error('This download is no longer waiting to start. Close this window.');
      $('#cancel').disabled = false;
      return;
    }
    $('#url').textContent = $('#url').title = d.url;
    if (d.probe && !d.probe.listing) return fill(d.probe);
    if (d.probe && !listing) fill(d.probe);
    await new Promise(r => setTimeout(r, t < 20 ? 150 : 500)); // the probe takes a moment, at most 15 s
  }
}

async function answer(action) {
  if (busy || (listing && action !== 'cancel')) return;
  if (!d || d.status !== 'pending' || !d.probe) return action === 'cancel' && window.close();
  lock(true, action);
  error(null);
  try {
    await api('/api/confirm', { id, action, path: $('#file').value, ...(d.kind === 'video' && (option() ? { format: option().key } : { quality: $('#format').value })) });
  } catch (e) {
    if (action === 'cancel') return window.close(); // already gone
    error(e.message);
    lock(false);
    return;
  }
  if (action === 'start') location.replace('/progress?id=' + encodeURIComponent(id)); // replace: one history entry, so close() still works
  else window.close();
}

$('#f').onsubmit = e => { e.preventDefault(); answer('start'); };
$('#later').onclick = () => answer('later');
$('#cancel').onclick = () => answer('cancel');
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { e.preventDefault(); answer('cancel'); }
});
$('#format').onchange = setFormat;
$('#cat').onchange = () => { $('#file').value = joinPath(folderFor(settings, $('#cat').value), splitPath($('#file').value)[1]); };
$('#browse').onclick = async () => {
  if (busy) return;
  lock(true);
  error(null);
  try {
    const { path } = await api('/api/browse', { path: $('#file').value });
    if (path) $('#file').value = path;
  } catch (e) { error(e.message); }
  lock(false);
  $('#browse').focus();
};

load();
</script>
</body>
</html>
