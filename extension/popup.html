<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  /* the app's greys and the logo's graphite (white in dark) */
  :root { --bg: #fff; --text: #1D1D1F; --muted: #6E6E73; --line: #E2E2E7; --accent: #3B3C3D; --on-accent: #fff; --err: #D70015; color-scheme: light dark; accent-color: var(--accent); }
  @media (prefers-color-scheme: dark) { :root { --bg: #1E1E20; --text: #F5F5F7; --muted: #A1A1A6; --line: #3A3A3E; --accent: #ECECEE; --on-accent: #1D1D1F; --err: #FF453A; } }
  body { margin: 0; width: 360px; padding: 12px; font: 13px/1.4 "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text); }
  h1 { font-size: 15px; margin: 0 0 8px; }
  h2 { font-size: 13px; margin: 14px 0 6px; color: var(--muted); }
  #status.off { color: var(--err); }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; gap: 8px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); }
  li span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  small { color: var(--muted); }
  button { font: inherit; color: inherit; background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; cursor: pointer; }
  .row { display: flex; gap: 8px; align-items: center; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  label { display: flex; gap: 6px; align-items: center; margin: 6px 0; }
  .empty { color: var(--muted); }
</style>
</head>
<body>
  <h1>Arrow</h1>
  <div id="status">Checking app…</div>
  <label><input type="checkbox" id="intercept"> Take over browser downloads</label>
  <label><input type="checkbox" id="overlay"> Show download button on videos</label>
  <section id="yt" hidden>
    <h2>This YouTube video</h2>
    <div class="row">
      <button id="ytdl" class="primary">Download this video</button>
    </div>
  </section>
  <h2>Media on this page</h2>
  <ul id="media"></ul>
  <p><button id="open" class="primary">Open Arrow</button></p>
  <script type="module" src="popup.js"></script>
</body>
</html>
