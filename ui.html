<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FastDL</title>
<style>
  :root {
    --window: #ECECEF; --toolbar: #F6F6F8; --sidebar: #E9E9EC; --panel: #FFFFFF; --alt: #F7F7F9;
    --line: #D9D9DE; --text: #1D1D1F; --muted: #6E6E73; --hover: rgba(0,0,0,.06);
    --accent: #0F766E; --on-accent: #FFFFFF; --fill: #0F766E; --soft: #D6EEEA; --bar: #E2E2E7;
    --done: #1E8E3E; --err: #D70015; --c-video: #AF52DE; --c-music: #E0245E; --c-doc: #0A6CDB; --c-zip: #D97706; --c-app: #5856D6; --c-other: #8E8E93;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --window: #1E1E20; --toolbar: #2A2A2D; --sidebar: #252528; --panel: #1B1B1D; --alt: #212124;
      --line: #3A3A3E; --text: #F5F5F7; --muted: #A1A1A6; --hover: rgba(255,255,255,.07);
      --fill: #14B8A6; --soft: #12403C; --bar: #3A3A3E; --done: #30D158; --err: #FF453A;
      --c-video: #BF5AF2; --c-music: #FF375F; --c-doc: #4DA3FF; --c-zip: #FFB340; --c-app: #7D7AFF; --c-other: #98989D;
    }
  }
  :root[data-theme="dark"] {
    --window: #1E1E20; --toolbar: #2A2A2D; --sidebar: #252528; --panel: #1B1B1D; --alt: #212124;
    --line: #3A3A3E; --text: #F5F5F7; --muted: #A1A1A6; --hover: rgba(255,255,255,.07);
    --fill: #14B8A6; --soft: #12403C; --bar: #3A3A3E; --done: #30D158; --err: #FF453A;
    --c-video: #BF5AF2; --c-music: #FF375F; --c-doc: #4DA3FF; --c-zip: #FFB340; --c-app: #7D7AFF; --c-other: #98989D;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--window); color: var(--text);
    font: 13px/1.35 "SF Pro Text", "SF Pro", -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums;
    display: flex; flex-direction: column; overflow: hidden;
  }
  svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  svg.s { width: 16px; height: 16px; }
  button, select, input, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--fill); outline-offset: 2px; }

  /* toolbar: icon above label, like IDM */
  .toolbar { display: flex; align-items: center; gap: 2px; padding: 6px 10px; background: var(--toolbar); border-bottom: 1px solid var(--line); overflow-x: auto; flex: none; }
  .brand { display: flex; align-items: center; gap: 8px; padding: 0 12px 0 4px; margin-right: 6px; border-right: 1px solid var(--line); }
  .brand img { width: 26px; height: 26px; }
  .brand b { font: 600 15px "SF Pro Display", "SF Pro", -apple-system, system-ui, sans-serif; letter-spacing: -.1px; }
  .tool { display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 64px; padding: 6px 8px 5px; border: 0; border-radius: 8px; background: none; cursor: pointer; font-size: 11.5px; color: var(--text); white-space: nowrap; flex: none; }
  .tool:hover { background: var(--hover); }
  .tool:disabled { opacity: .38; cursor: default; background: none; }
  .tool.primary svg { color: var(--fill); }
  .sep { width: 1px; align-self: stretch; margin: 6px 6px; background: var(--line); flex: none; }

  /* banners under the toolbar */
  #offline { background: var(--err); color: #fff; padding: 8px 12px; flex: none; }
  #countdown { display: flex; align-items: center; gap: 8px; background: var(--accent); color: var(--on-accent); padding: 6px 12px; font-weight: 600; flex: none; }
  #offer { display: flex; align-items: center; gap: 8px; padding: 6px 12px; background: var(--soft); border-bottom: 1px solid var(--line); flex: none; }
  #offer span { word-break: break-all; }

  /* sidebar + list */
  .content { flex: 1; display: grid; grid-template-columns: 196px 1fr; min-height: 0; }
  nav { background: var(--sidebar); border-right: 1px solid var(--line); padding: 10px 8px; overflow: auto; }
  nav h2 { font-size: 11px; font-weight: 600; color: var(--muted); margin: 8px 8px 4px; letter-spacing: .2px; }
  .cat { display: flex; align-items: center; gap: 8px; width: 100%; padding: 5px 8px; border: 0; border-radius: 6px; background: none; cursor: pointer; text-align: left; }
  .cat:hover { background: var(--hover); }
  .cat[aria-current="true"] { background: var(--soft); color: var(--text); font-weight: 600; }
  .cat[aria-current="true"] svg { color: var(--fill); }
  .cat .n { margin-left: auto; color: var(--muted); font-size: 12px; font-weight: 400; }
  .listwrap { background: var(--panel); overflow: auto; min-width: 0; }
  table { width: 100%; border-collapse: collapse; }
  th { position: sticky; top: 0; z-index: 1; background: var(--panel); text-align: left; font-weight: 500; font-size: 12px; color: var(--muted); padding: 6px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 0 10px; height: 30px; white-space: nowrap; }
  tbody { user-select: none; }
  tbody tr.alt { background: var(--alt); }
  tbody tr { cursor: default; }
  tbody tr:focus-visible { outline-offset: -2px; }
  tbody tr[aria-selected="true"] { background: var(--accent); color: var(--on-accent); }
  tbody tr[aria-selected="true"]:focus-visible { outline-color: var(--on-accent); }
  tbody tr[aria-selected="true"] .muted, tbody tr[aria-selected="true"] .ft, tbody tr[aria-selected="true"] .st { color: var(--on-accent) !important; }
  td.name { max-width: 340px; overflow: hidden; text-overflow: ellipsis; }
  td.stc { max-width: 300px; }
  .fn { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .fn span { overflow: hidden; text-overflow: ellipsis; }
  .num { text-align: right; }
  th.num { text-align: right; }
  .muted { color: var(--muted); }
  .status { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .status .st { overflow: hidden; text-overflow: ellipsis; }
  .mini { width: 90px; height: 6px; border-radius: 3px; background: var(--bar); overflow: hidden; flex: none; }
  .mini i { display: block; height: 100%; background: var(--fill); border-radius: 3px; }
  tr[aria-selected="true"] .mini { background: rgba(255,255,255,.3); }
  tr[aria-selected="true"] .mini i { background: #fff; }
  .st.done { color: var(--done); } .st.err { color: var(--err); }
  #empty { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 48px 16px; text-align: center; color: var(--muted); }
  #empty > svg { width: 32px; height: 32px; }
  #empty p { margin: 0; max-width: 420px; }

  /* details: IDM's segment view, docked */
  .details { display: grid; grid-template-columns: 1fr auto; gap: 6px 28px; padding: 14px 18px 14px; background: var(--toolbar); border-top: 1px solid var(--line); flex: none; }
  .details > div:first-child { min-width: 0; }
  .dname { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .dname b { font: 600 15px "SF Pro Display", "SF Pro", -apple-system, system-ui, sans-serif; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .durl { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
  .stats { display: grid; grid-template-columns: repeat(5, auto); gap: 2px 26px; align-content: start; margin: 0; }
  .stats dt { font-size: 11px; color: var(--muted); }
  .stats dd { margin: 0; font-weight: 600; }
  .segs { grid-column: 1 / -1; position: relative; height: 14px; border-radius: 4px; background: var(--bar); overflow: hidden; margin-top: 6px; }
  .segs i { position: absolute; top: 0; bottom: 0; background: var(--fill); border-right: 2px solid var(--toolbar); }
  .segs.done i { background: var(--done); } .segs.error i { background: var(--err); }
  .dact { grid-column: 1 / -1; display: flex; gap: 8px; margin-top: 4px; }
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); color: var(--text); cursor: pointer; }
  .btn:hover { background: var(--hover); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

  footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 5px 12px; font-size: 12px; color: var(--muted); background: var(--toolbar); border-top: 1px solid var(--line); flex: none; }
  footer select { padding: 2px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }

  dialog { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--text); width: min(460px, calc(100vw - 32px)); padding: 18px; }
  dialog::backdrop { background: rgba(0,0,0,.3); }
  dialog h2 { margin: 0 0 12px; font: 600 15px "SF Pro Display", "SF Pro", -apple-system, system-ui, sans-serif; }
  dialog label { display: grid; gap: 4px; margin-bottom: 10px; color: var(--muted); }
  dialog label.check { display: flex; gap: 6px; align-items: center; }
  dialog input[type=text], dialog input[type=number], dialog input[type=time], dialog select, dialog textarea { background: var(--window); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
  dialog textarea { resize: vertical; min-height: 84px; }
  dialog menu { display: flex; justify-content: flex-end; gap: 8px; padding: 0; margin: 14px 0 0; }

  @media (max-width: 819px) {
    .content { grid-template-columns: 1fr; }
    nav, table :is(th, td):nth-child(6) { display: none; }
  }
  @media (max-width: 639px) {
    table :is(th, td):nth-child(5) { display: none; }
    .details { grid-template-columns: 1fr; }
    .stats { grid-template-columns: repeat(3, auto); }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="toolbar" role="toolbar" aria-label="Downloads">

  <button class="tool" id="tClean"><svg class="i"><use href="#i-clean"/></svg>Delete completed</button>

    <button class="cat" data-filter="Video"><svg class="i s" style="color:var(--c-video)"><use href="#i-video"/></svg>Video<span class="n"></span></button>

    <label id="qualityRow" hidden>Quality

        <option value="best">Best quality</option><option value="1080">1080p</option><option value="720">720p</option><option value="480">480p</option><option value="mp3">MP3 (audio only)</option>
      </select>
    </label>
    <label>Save as <input id="name" type="text" placeholder="Optional, for a single link"></label>

    <h2>Settings</h2>
    <label>Save to folder <input name="dir" type="text" required></label>

    <label class="check"><input name="startup" type="checkbox"> Start with Windows (in the tray)</label>
    <menu><button value="cancel" formnovalidate class="btn">Cancel</button><button value="save" class="btn primary">Save</button></menu>
  </form>
</dialog>

<script id="helpers">
// No DOM in this block: ui.test.js runs it in Node.
const BATCH = /\[(\d+)-(\d+)\]/;

// Batch links: "img[001-120].jpg" gives img001.jpg … img120.jpg. Zero padding is kept, a range may count down,
// and several ranges in one link multiply. Never builds more than max links: a range that would pass it throws.
function expandBatch(links, max = 1000) {
  links = [...links];
  for (let i = 0; i < links.length; i++) {
    const m = BATCH.exec(links[i]);
    if (!m) continue;
    const a = Number(m[1]), b = Number(m[2]), count = Math.abs(b - a) + 1;
    const pad = /^0\d/.test(m[1]) || /^0\d/.test(m[2]) ? Math.max(m[1].length, m[2].length) : 0;
    if (links.length - 1 + count > max) throw new Error(`A batch can add at most ${max} links.`);
    const out = [];
    for (let k = 0; k < count; k++) out.push(links[i].replace(BATCH, String(a < b ? a + k : a - k).padStart(pad, '0')));
    links.splice(i--, 1, ...out); // i-- checks the first new link again, for a second range
  }
  return links;
}

// Clipboard monitoring offers only a lone http(s) link to a file type FastDL sorts (engine.js CATEGORIES, sent as state.exts).
function clipboardLink(text, exts) {
  const t = String(text).trim();
  if (!/^https?:\/\/\S+$/i.test(t)) return null;
  try {
    const u = new URL(t);
    return exts.includes(/\.(\w+)$/.exec(u.pathname)?.[1].toLowerCase()) ? u.href : null;
  } catch {
    return null;
  }
}

// Sidebar category: from the file extension (engine.js CATEGORIES, sent as state.categories), else Other.
// YouTube downloads are Video, or Music as MP3; HLS is always Video.
function category(d, categories) {
  if (d.kind === 'video') return d.quality === 'mp3' ? 'Music' : 'Video';
  if (d.kind === 'hls') return 'Video';
  const ext = /\.(\w+)$/.exec(d.file || d.name || String(d.url).split(/[?#]/)[0])?.[1].toLowerCase();
  return Object.keys(categories).find(c => categories[c].includes(ext)) ?? 'Other';
}

// "Date added" column: "Today 14:05", "Yesterday", else a short date (with the year when it is not this year).
function dateLabel(ts, now = Date.now()) {
  if (!ts) return '';
  const t = new Date(ts), n = new Date(now), pad = v => String(v).padStart(2, '0');
  const day = (y, m, d) => new Date(y, m, d).getTime();
  const tDay = day(t.getFullYear(), t.getMonth(), t.getDate());
  if (tDay === day(n.getFullYear(), n.getMonth(), n.getDate())) return `Today ${pad(t.getHours())}:${pad(t.getMinutes())}`;
  if (tDay === day(n.getFullYear(), n.getMonth(), n.getDate() - 1)) return 'Yesterday';
  return t.toLocaleDateString(undefined, { day: 'numeric', month: 'short', ...(t.getFullYear() !== n.getFullYear() && { year: 'numeric' }) });
}
</script>
<script>
const $ = s => document.querySelector(s);
const rows = new Map(); // id → row parts, in list order
const seen = new Map();
const selected = new Set();
let anchor = null, cursor = null; // Shift range start; the row that holds the list's tab stop
let state = { downloads: [], settings: {}, categories: {} };
let filter = 'all';
try { filter = localStorage.getItem('fastdl-filter') || 'all'; } catch {}
if (!document.querySelector(`.cat[data-filter="${CSS.escape(filter)}"]`)) filter = 'all';
const LABEL = { queued: 'Queued', downloading: 'Downloading', paused: 'Paused', done: 'Complete', scheduled: 'Scheduled', removed: 'Removing' };
const PHASE = { video: 'Downloading video', audio: 'Downloading audio', merging: 'Merging', converting: 'Converting to MP3' };
const ICON = { Video: ['video', 'c-video'], Music: ['music', 'c-music'], Compressed: ['zip', 'c-zip'], Documents: ['doc', 'c-doc'], Programs: ['app', 'c-app'], Other: ['file', 'c-other'] };
const isYouTube = u => /^https?:\/\/((www|m|music)\.)?youtube\.com\/|^https?:\/\/youtu\.be\//i.test(u);
const canResume = d => ['paused', 'error', 'scheduled'].includes(d.status);
const canStop = d => ['downloading', 'queued', 'scheduled'].includes(d.status);

async function api(path, body) {
  const r = await fetch(path, body ? { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) } : undefined);
  const j = await r.json();
  if (!r.ok) throw new Error(j.error);
  return j;
}
const size = n => n == null || !isFinite(n) ? '?' : n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(1) + ' KB' : n < 1073741824 ? (n / 1048576).toFixed(1) + ' MB' : (n / 1073741824).toFixed(2) + ' GB';
const time = s => !isFinite(s) ? '' : s < 60 ? Math.ceil(s) + ' s' : s < 3600 ? Math.floor(s / 60) + ' min ' + Math.floor(s % 60) + ' s' : Math.floor(s / 3600) + ' h ' + Math.floor(s % 3600 / 60) + ' min';
const total = d => d.kind === 'hls' && d.status !== 'done' ? (d.hls?.done ? d.hls.bytes / d.hls.done * d.hls.total : null) : d.size;
const fraction = d => d.status === 'done' ? 1 : d.kind === 'hls' ? (d.hls ? d.hls.done / d.hls.total : 0) : d.size ? d.got / d.size : 0;
const shortName = d => d.name || (d.kind === 'video' ? 'YouTube video' : decodeURIComponent(d.url.split('?')[0].split('/').pop()) || d.url);
const eta = d => { const t = total(d); return d.status === 'downloading' && d.speed && t ? time((t - d.got) / d.speed) : ''; };
const plural = n => n === 1 ? '1 download' : `${n} downloads`;
const setIcon = (svg, cat) => { svg.firstChild.setAttribute('href', '#i-' + ICON[cat][0]); svg.style.color = `var(--${ICON[cat][1]})`; };
const picked = () => state.downloads.filter(d => selected.has(d.id));
const visible = () => [...rows.values()].filter(r => !r.tr.hidden);
const narrow = matchMedia('(max-width: 819px)'); // the sidebar is hidden there, so its filter must not hide rows
const matches = (r, f) => f === 'all' || (f === 'unfinished' ? r.d.status !== 'done' : f === 'finished' ? r.d.status === 'done' : f === 'scheduled' ? r.d.status === 'scheduled' : r.cat === f);

// Status column: [text, class, bar fraction or null]
function status(d) {
  const pct = Math.floor(fraction(d) * 1000) / 10 + '%';
  if (d.status === 'error') return ['Error: ' + d.error, 'err', null];
  if (d.status === 'done') return ['Complete', 'done', null];
  if (d.status === 'downloading') return [PHASE[d.phase] || pct, '', fraction(d)];
  if (d.status === 'paused') return ['Paused · ' + pct, '', fraction(d)];
  return [LABEL[d.status], 'muted', null];
}

// Run actions one after the other, then show the new state.
async function run(ops) {
  try { for (const [id, op, extra] of ops) await api('/api/action', { id, op, ...extra }); } catch (e) { alert(e.message); }
  refresh();
}

function render(st) {
  const ids = new Set(st.downloads.map(d => d.id));
  let lostFocus = false;
  for (const [id, r] of rows) if (!ids.has(id)) {
    lostFocus ||= r.tr.contains(document.activeElement);
    r.tr.remove(); rows.delete(id); selected.delete(id);
    if (cursor === id) cursor = null;
  }
  for (const d of st.downloads) {
    let r = rows.get(d.id);
    if (!r) {
      const tr = document.createElement('tr');
      tr.dataset.id = d.id;
      tr.innerHTML = '<td class="name"><div class="fn"><svg class="i s ft" aria-hidden="true"><use/></svg><span></span></div></td><td class="num"></td>'
        + '<td class="stc"><div class="status"><div class="mini"><i></i></div><span class="st"></span></div></td><td class="num"></td><td class="num"></td><td class="muted"></td>';
      const c = tr.children;
      r = { tr, icon: c[0].querySelector('svg'), name: c[0].querySelector('span'), size: c[1], mini: c[2].querySelector('.mini'), st: c[2].querySelector('.st'), eta: c[3], rate: c[4], date: c[5] };
      rows.set(d.id, r);
      $('#list').append(tr);
    }
    r.d = d;
    const cat = category(d, st.categories);
    if (r.cat !== cat) setIcon(r.icon, r.cat = cat);
    r.name.textContent = shortName(d);
    r.tr.title = d.file || d.url;
    const t = total(d);
    r.size.textContent = t == null ? '' : size(Math.round(t));
    const [text, cls, bar] = status(d);
    r.st.textContent = text;
    r.st.className = 'st ' + cls;
    r.st.title = d.error || '';
    r.mini.hidden = bar == null;
    if (bar != null) r.mini.firstChild.style.width = bar * 100 + '%';
    r.eta.textContent = eta(d);
    r.rate.textContent = d.status === 'downloading' ? size(d.speed) + '/s' : '';
    r.date.textContent = dateLabel(d.added);
    if (seen.get(d.id) === 'downloading' && d.status === 'done' && window.Notification?.permission === 'granted') new Notification('Download complete', { body: shortName(d) });
    seen.set(d.id, d.status);
  }
  layout();
  if (lostFocus && cursor) rows.get(cursor).tr.focus(); // a deleted row had focus: keep it in the list

  const active = st.downloads.filter(d => d.status === 'downloading');
  $('#total').textContent = `${active.length} downloading · ${size(active.reduce((a, d) => a + d.speed, 0))}/s`
    + (st.settings.speedLimitKB ? ` · limit ${st.settings.speedLimitKB} KB/s` : '')
    + (st.settings.scheduleAt ? ` · scheduled start ${st.settings.scheduleAt}` : '');
  if (offered && st.downloads.some(d => d.url === offered)) offer(null);
  const cd = $('#countdown');
  cd.hidden = st.powerIn == null;
  if (st.powerIn != null) {
    const going = st.whenDone === 'shutdown' ? 'Shutting down' : 'Going to sleep';
    if (!counting && window.Notification?.permission === 'granted') new Notification(`${going} in ${st.powerIn} seconds`, { body: 'All downloads finished. Open FastDL to cancel.' });
    const text = `All downloads finished. ${going} in`;
    if (cd.children[0].textContent !== text) cd.children[0].textContent = text; // rewriting it would make screen readers repeat the alert
    cd.children[1].textContent = st.powerIn + ' s.';
  }
  counting = st.powerIn != null;
  // only when the server's value changes, so a poll that started before the user's pick can't undo it
  if (st.whenDone !== shownWhenDone) $('#whenDone').value = shownWhenDone = st.whenDone;
}

// Filter, stripes, selection marks, counts, empty state, details and toolbar: everything that depends on the selection.
function layout() {
  let n = 0;
  for (const [id, r] of rows) {
    const show = matches(r, narrow.matches ? 'all' : filter);
    r.tr.hidden = !show;
    if (show) r.tr.classList.toggle('alt', n++ % 2 === 1);
    else selected.delete(id);
    r.tr.setAttribute('aria-selected', selected.has(id));
  }
  if (!rows.get(cursor) || rows.get(cursor).tr.hidden) cursor = visible()[0]?.d.id ?? null;
  for (const [id, r] of rows) r.tr.tabIndex = id === cursor ? 0 : -1;
  for (const b of document.querySelectorAll('.cat')) {
    b.setAttribute('aria-current', b.dataset.filter === filter);
    b.querySelector('.n').textContent = [...rows.values()].filter(r => matches(r, b.dataset.filter)).length;
  }
  $('#empty').hidden = n > 0;
  $('#empty p').textContent = rows.size ? 'No downloads here.' : 'No downloads yet. Add a link, drop links on this window, or install the browser extension to catch downloads and videos.';
  details();
  const sel = picked();
  $('#tResume').disabled = !sel.some(canResume);
  $('#tStop').disabled = !sel.some(canStop);
  $('#tStopAll').disabled = !state.downloads.some(d => ['downloading', 'queued'].includes(d.status));
  $('#tDelete').disabled = !sel.length;
  $('#tClean').disabled = !state.downloads.some(d => d.status === 'done');
}

function details() {
  const sel = picked(), d = sel.length === 1 && sel[0];
  $('#dHead').hidden = !sel.length;
  $('#dIcon').hidden = $('#dStats').hidden = $('#dSegs').hidden = $('#dAct').hidden = !d;
  if (!d) {
    $('#dName').textContent = sel.length + ' downloads selected';
    $('#dUrl').textContent = sel.length ? 'Total size ' + size(sel.reduce((a, x) => a + (total(x) ?? 0), 0)) : 'Select a download to see its details.';
    return;
  }
  setIcon($('#dIcon'), category(d, state.categories));
  $('#dName').textContent = shortName(d);
  $('#dUrl').textContent = `${d.url} · Saved to ${d.file ? d.file.replace(/[\\/][^\\/]*$/, '') : state.settings.dir}`;
  $('#dUrl').title = d.url;
  const t = total(d), running = d.status === 'downloading';
  const dd = $('#dStats').querySelectorAll('dd');
  dd[0].textContent = `${size(d.got)} of ${size(t && Math.round(t))}`;
  dd[1].textContent = running ? size(d.speed) + '/s' : '—';
  dd[2].textContent = eta(d) || '—';
  dd[3].textContent = running ? d.connections : '—';
  dd[4].textContent = d.resumable === true ? 'Yes' : d.resumable === false ? 'No' : '—';
  // one piece per connection, like IDM's segment view; HLS and video get one fill
  const pieces = d.status !== 'done' && d.segments && d.size && d.kind !== 'hls' ? d.segments.map(([start, , pos]) => [start / d.size, (pos - start) / d.size]) : [[0, fraction(d)]];
  const html = pieces.map(([a, w]) => `<i style="left:${a * 100}%;width:max(1px, ${w * 100}%)"></i>`).join('');
  const segs = $('#dSegs');
  segs.className = 'segs ' + d.status;
  if (segs.dataset.html !== html) segs.innerHTML = segs.dataset.html = html;
  $('#dOpen').hidden = d.status !== 'done';
  $('#dFolder').hidden = !d.file;
  $('#dLink').hidden = !['paused', 'error'].includes(d.status) || d.kind === 'video';
  $('#dAct').hidden = $('#dOpen').hidden && $('#dFolder').hidden && $('#dLink').hidden;
}

function refresh() {
  return api('/api/state').then(st => { state = st; $('#offline').hidden = true; render(st); }, () => { $('#offline').hidden = false; });
}

// Selection, like a file list: how = 'only' | 'toggle' | 'range' (from the anchor) | 'move' (only the cursor moves)
function select(id, how) {
  const v = visible().map(r => r.d.id), a = v.indexOf(anchor);
  if (how === 'range' && a >= 0) {
    const b = v.indexOf(id);
    selected.clear();
    for (const x of v.slice(Math.min(a, b), Math.max(a, b) + 1)) selected.add(x);
  } else if (how === 'toggle') {
    selected.has(id) ? selected.delete(id) : selected.add(id);
    anchor = id;
  } else if (how !== 'move') {
    selected.clear();
    selected.add(id);
    anchor = id;
  }
  cursor = id;
  layout();
}
const openDone = d => d?.status === 'done' && run([[d.id, 'open']]);

$('#list').onclick = e => {
  const tr = e.target.closest('tr');
  if (tr) select(tr.dataset.id, e.shiftKey ? 'range' : e.ctrlKey || e.metaKey ? 'toggle' : 'only');
};
$('#list').ondblclick = e => { const tr = e.target.closest('tr'); if (tr) openDone(rows.get(tr.dataset.id)?.d); };
$('#list').onkeydown = e => {
  const v = visible().map(r => r.d.id), i = v.indexOf(cursor);
  const move = j => {
    const id = v[Math.max(0, Math.min(v.length - 1, j))];
    select(id, e.shiftKey ? 'range' : e.ctrlKey ? 'move' : 'only');
    rows.get(id).tr.focus();
  };
  if (!v.length) return;
  if (e.key === 'ArrowDown') move(i + 1);
  else if (e.key === 'ArrowUp') move(i - 1);
  else if (e.key === 'Home') move(0);
  else if (e.key === 'End') move(v.length - 1);
  else if (e.key === ' ' && cursor) select(cursor, 'toggle');
  else if (e.key === 'Enter') openDone(rows.get(cursor)?.d);
  else if (e.key === 'Delete') del();
  else if (e.key.toLowerCase() === 'a' && (e.ctrlKey || e.metaKey)) { v.forEach(id => selected.add(id)); layout(); }
  else return;
  e.preventDefault();
};

narrow.onchange = layout;
for (const b of document.querySelectorAll('.cat')) b.onclick = () => {
  filter = b.dataset.filter;
  try { localStorage.setItem('fastdl-filter', filter); } catch {}
  layout();
};

function del() {
  const list = picked();
  if (!list.length || !confirm(`Remove ${plural(list.length)} from the list?`)) return;
  const files = list.some(d => d.status === 'done') && confirm('Also delete the downloaded files from disk?');
  run(list.map(d => [d.id, files && d.status === 'done' ? 'removeFile' : 'remove']));
}
$('#tResume').onclick = () => run(picked().filter(canResume).map(d => [d.id, 'resume']));
$('#tStop').onclick = () => run(picked().filter(canStop).map(d => [d.id, 'pause']));
$('#tStopAll').onclick = () => api('/api/pause-all', {}).then(refresh, e => alert(e.message));
$('#tDelete').onclick = del;
$('#tClean').onclick = () => {
  const done = state.downloads.filter(d => d.status === 'done');
  if (done.length && confirm(`Remove ${done.length} finished downloads from the list? The files stay on disk.`)) run(done.map(d => [d.id, 'remove']));
};
const one = () => { const s = picked(); return s.length === 1 ? s[0] : null; };
$('#dOpen').onclick = () => openDone(one());
$('#dFolder').onclick = () => { const d = one(); if (d) run([[d.id, 'folder']]); };
$('#dLink').onclick = () => {
  const d = one();
  const url = d && prompt('New link for the same file (when the old one expired):', d.url);
  if (url) run([[d.id, 'url', { url }]]);
};

const addDlg = $('#addDlg');
$('#tAdd').onclick = $('#emptyAdd').onclick = () => addDlg.showModal();
$('#addCancel').onclick = () => addDlg.close();

async function add(urls) {
  if (window.Notification?.permission === 'default') Notification.requestPermission();
  const name = urls.length === 1 ? $('#name').value.trim() : '';
  for (const url of urls) {
    try { await api('/api/add', { url, name: name || undefined, scheduled: $('#later').checked, quality: isYouTube(url) ? $('#quality').value : undefined }); }
    catch (e) { alert(`${url}\n${e.message}`); return false; }
  }
  $('#url').value = $('#name').value = '';
  $('#qualityRow').hidden = true; // keeps its value for the next YouTube link
  refresh();
  return true;
}

$('#url').oninput = () => { $('#qualityRow').hidden = !$('#url').value.split(/\s+/).some(isYouTube); };
$('#add').onsubmit = e => {
  e.preventDefault();
  const typed = $('#url').value.split(/\s+/).filter(Boolean);
  let urls;
  try { urls = expandBatch(typed); } catch (err) { return alert(err.message); }
  if (urls.length > typed.length && !confirm(`Add ${urls.length} downloads?\n\n${urls[0]}\n…\n${urls.at(-1)}`)) return;
  add(urls).then(ok => ok && addDlg.close());
};
document.ondragover = e => e.preventDefault();
document.ondrop = e => {
  e.preventDefault();
  const text = e.dataTransfer.getData('text/uri-list') || e.dataTransfer.getData('text/plain');
  const urls = text.split(/\s+/).filter(u => /^https?:\/\//i.test(u));
  if (urls.length) add(urls);
};

const dlg = $('#settings'), f = dlg.querySelector('form').elements;
function openSettings() {
  for (const [k, v] of Object.entries(state.settings)) if (f[k]) f[k].type === 'checkbox' ? (f[k].checked = v) : (f[k].value = v);
  dlg.showModal();
}
$('#tOptions').onclick = openSettings;
$('#tScheduler').onclick = () => { openSettings(); f.scheduleAt.focus(); };
dlg.onclose = () => {
  if (dlg.returnValue !== 'save') return;
  const askClipboard = f.clipboard.checked && !state.settings.clipboard; // just turned on: the browser asks for clipboard access now
  api('/api/settings', {
    dir: f.dir.value, connections: f.connections.value, maxActive: f.maxActive.value,
    speedLimitKB: f.speedLimitKB.value, scheduleAt: f.scheduleAt.value, categories: f.categories.checked,
    clipboard: f.clipboard.checked, startup: f.startup.checked,
  }).then(refresh).then(() => askClipboard && checkClipboard(true), e => alert(e.message));
};

// Clipboard monitoring: read when this window gets focus, so nothing watches the clipboard in the background,
// and only ever offer the link.
let lastClip = null, offered = null, counting = false, shownWhenDone;
function offer(url) {
  offered = url;
  $('#offer span').textContent = url ?? '';
  $('#offer').hidden = !url;
}
async function checkClipboard(asked) {
  if (!state.settings.clipboard) return;
  let text;
  try { text = await navigator.clipboard.readText(); } catch {
    if (asked) alert('FastDL could not read the clipboard. Allow clipboard access for this page in the browser\'s site settings, then turn the setting on again.');
    return;
  }
  if (text === lastClip) return; // each copy is offered once
  lastClip = text;
  const url = clipboardLink(text, state.exts);
  if (url && !state.downloads.some(d => d.url === url)) offer(url);
}
window.addEventListener('focus', () => checkClipboard());
$('#offerYes').onclick = () => { const url = offered; offer(null); api('/api/add', { url }).then(refresh, e => alert(e.message)); };
$('#offerNo').onclick = () => offer(null);

const whenDone = value => api('/api/settings', { whenDone: value }).then(refresh, e => alert(e.message));
$('#whenDone').onchange = e => whenDone(e.target.value);
$('#countdown button').onclick = () => whenDone('');

// One window at a time: "Open" in the tray starts a new app window, and the browser can't bring an old one to the front, so old ones close.
const windows = new BroadcastChannel('fastdl-window');
windows.onmessage = () => window.close();
windows.postMessage('opened');

layout();
refresh().then(() => checkClipboard());
setInterval(refresh, 700);
</script>
</body>
</html>
